# Scheisse auf dem Raspberry Pi (arm64, Raspberry Pi OS 64-bit).
# Nutzt nur fertige Images von Docker Hub – kein Build auf dem Pi.
#
#   cp .env.example .env    # Werte setzen (JWT_SECRET, POSTGRES_PASSWORD)
#   docker login            # Repo ist privat
#   docker compose up -d                    # App auf http://<pi>:8080
#   docker compose --profile tools up -d    # zusätzlich pgAdmin auf http://<pi>:5050
name: scheisse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheisse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scheisse}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: ${IMAGE_REPO:-olafimus/olivers-master-repo}:scheisse-server-${TAG:-1.0.0}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-scheisse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheisse}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # leer = automatisch (Secure nur bei HTTPS, X-Forwarded-Proto wird ausgewertet); true/false erzwingt
      COOKIE_SECURE: ${COOKIE_SECURE:-}

  web:
    image: ${IMAGE_REPO:-olafimus/olivers-master-repo}:scheisse-web-${TAG:-1.0.0}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:8080"

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: "80"
      PG_USER: ${POSTGRES_USER:-scheisse}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB:-scheisse}
    # Server-Eintrag + Passwortdatei beim Start aus den Env-Werten erzeugen (keine Extra-Dateien nötig)
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'db:5432:*:%s:%s\n' "$$PG_USER" "$$PG_PASSWORD" > /var/lib/pgadmin/pgpass
        chmod 600 /var/lib/pgadmin/pgpass
        printf '{"Servers":{"1":{"Name":"Scheisse","Group":"Servers","Host":"db","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"disable","PassFile":"/var/lib/pgadmin/pgpass"}}}' "$$PG_DB" "$$PG_USER" > /tmp/servers.json
        export PGADMIN_SERVER_JSON_FILE=/tmp/servers.json
        exec /entrypoint.sh
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
