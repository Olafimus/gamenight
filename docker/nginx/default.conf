server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # API + SSE -> server
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
  }

  # never cache entry points of the PWA
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  # hashed build output
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
